[package]
name = "cuda"
version = "0.1.0"
edition = "2021"
description = "Drop-in libcuda / nvcuda replacement running on Intel GPUs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ptx2spirv = { path = "../ptx2spirv" }
ptx = { path = "../ptx" }

# Only used by tests (ABI conformance against ZLUDA's generated definitions);
# the shipped libcuda does not depend on it. See vendor/README.md.
[dev-dependencies]
cuda_types = { path = "../../vendor/cuda_types" }
