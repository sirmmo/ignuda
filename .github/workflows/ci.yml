name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.85.0"

jobs:
  # Build every crate for Linux and cross-compile the libraries for Windows,
  # then compile the committed PTX to SPIR-V and validate it. No GPU, no NVIDIA
  # software — this proves the compiler and all libraries build and emit valid
  # SPIR-V.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-mingw-w64-x86-64 spirv-tools

      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add x86_64-pc-windows-gnu
          rustc --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build workspace (Linux)
        run: cargo build --workspace --release

      - name: Cross-build libraries (Windows, x86_64-pc-windows-gnu)
        run: cargo build --release --target x86_64-pc-windows-gnu -p cuda -p cudart -p cublas

      - name: Run tests
        # ignuda's own crates only; the vendored crates under vendor/ are
        # third-party (ZLUDA) and their internal test suites are not part of
        # ignuda's CI contract (and don't all compile under workspace-wide
        # Cargo feature unification). They are still built by the build steps.
        run: cargo test -p ptx -p ptx2spirv -p cuda -p cudart -p cublas --release

      - name: Compile PTX to SPIR-V and validate
        run: |
          set -e
          PTX2SPV=target/release/ptx2spv
          for ptx in kernels/gemm.ptx kernels/gemm_half.ptx samples/kernels.ptx; do
            out="${ptx##*/}"; out="${out%.ptx}.spv"
            echo "== $ptx -> $out =="
            "$PTX2SPV" "$ptx" "$out"
            spirv-val "$out"
          done

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp target/release/libcuda.so   dist/libcuda.so.1
          cp target/release/libcudart.so dist/libcudart.so.12
          cp target/release/libcublas.so dist/libcublas.so.12
          cp target/x86_64-pc-windows-gnu/release/cuda.dll   dist/nvcuda.dll
          cp target/x86_64-pc-windows-gnu/release/cudart.dll dist/cudart64_12.dll
          cp target/x86_64-pc-windows-gnu/release/cublas.dll dist/cublas64_12.dll
          cp *.spv dist/ 2>/dev/null || true
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ignuda-libraries
          path: dist/

  # Run the samples end to end against ignuda on Intel's OpenCL CPU runtime —
  # the same runtime the iGPU driver shares a SPIR-V front end with. This needs
  # no GPU and no NVIDIA toolkit (the samples use a bundled clean-room cuda.h).
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenCL + build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl gnupg \
            ocl-icd-libopencl1 ocl-icd-opencl-dev opencl-headers clinfo
          curl -fsSL https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneapi.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends intel-oneapi-runtime-opencl
          clinfo -l || true

      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build ignuda libraries
        run: cargo build -p cuda -p cudart -p cublas

      - name: Stage libraries with runtime sonames
        run: |
          LIB="$RUNNER_TEMP/ignuda-lib"
          mkdir -p "$LIB"
          cp target/debug/libcuda.so   "$LIB/libcuda.so.1"
          cp target/debug/libcudart.so "$LIB/libcudart.so.12"
          cp target/debug/libcublas.so "$LIB/libcublas.so.12"
          ln -sf libcuda.so.1   "$LIB/libcuda.so"
          ln -sf libcudart.so.12 "$LIB/libcudart.so"
          ln -sf libcublas.so.12 "$LIB/libcublas.so"
          echo "IGNUDA_LIB=$LIB" >> "$GITHUB_ENV"

      - name: Driver-API sample (hand-written PTX)
        working-directory: samples
        env:
          LD_LIBRARY_PATH: ${{ env.IGNUDA_LIB }}
          IGNUDA_DEVICE_TYPE: cpu
        run: |
          gcc -Iinclude -o driver_test driver_test.c -L"$IGNUDA_LIB" -lcuda
          ./driver_test kernels.ptx

      - name: cuBLAS sample (SGEMM vs CPU reference)
        working-directory: samples
        env:
          LD_LIBRARY_PATH: ${{ env.IGNUDA_LIB }}
          IGNUDA_DEVICE_TYPE: cpu
        run: |
          gcc -o cublas_test cublas_test.c -L"$IGNUDA_LIB" -lcudart -lcublas
          ./cublas_test

      - name: cuBLAS GemmEx sample (FP16 vs CPU reference)
        working-directory: samples
        env:
          LD_LIBRARY_PATH: ${{ env.IGNUDA_LIB }}
          IGNUDA_DEVICE_TYPE: cpu
        run: |
          gcc -o cublas_gemmex_test cublas_gemmex_test.c -L"$IGNUDA_LIB" -lcudart -lcublas -lm
          ./cublas_gemmex_test

      - name: Device properties sample (cudaGetDeviceProperties)
        working-directory: samples
        env:
          LD_LIBRARY_PATH: ${{ env.IGNUDA_LIB }}
          IGNUDA_DEVICE_TYPE: cpu
          IGNUDA_CC: "5.2"
        run: |
          gcc -o device_props_test device_props_test.c -L"$IGNUDA_LIB" -lcudart
          ./device_props_test

  # Style and lint checks. Advisory for now: the tree is not yet rustfmt/clippy
  # clean, so this reports problems without failing the build.
  lint:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ env.RUST_VERSION }} with rustfmt + clippy
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup component add rustfmt clippy
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets
